# FILE: .github/workflows/deploy-pages.yml
name: Deploy DeusEx v3 Web Portal to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "web_portal/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required web_portal static files
        run: |
          for file in index.html guides.html privacy.html terms.html callback.html 404.html styles.css app.js; do
            if [ ! -f "web_portal/$file" ]; then
              echo "Missing required portal file: web_portal/$file" >&2
              exit 1
            fi
          done

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload web_portal artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web_portal

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
